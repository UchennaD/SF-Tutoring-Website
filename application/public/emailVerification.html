<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Email Verification</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">Gator Tutor</h2>
        </div>
        <div id="header-right">
            <a href="#" id="loginLink">Login</a>
            <a href="#" id="signupLink">Sign Up</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="content">
        <h1>Verify Your Email</h1>

        <div class="verification-container">
            <p>Enter the 4-digit code sent to your email</p>
            
            <div class="digit-inputs">
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
            </div>

            <a href="login.html" id="enterButton">Enter</a>
        </div>
    </div>

    <script>
        const digitBoxes = document.querySelectorAll('.digit-box');

        digitBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const value = e.target.value;

                if (!/^[1-9]$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                if (value && index < digitBoxes.length - 1) {
                    digitBoxes[index + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    digitBoxes[index - 1].focus();
                }
            });
        });

        document.getElementById('enterButton').addEventListener('click', (e) => {
            const code = Array.from(digitBoxes).map(box => box.value).join('');
            if (code.length === 4) {
                console.log('Verification code:', code);
            } else {
                alert('Please enter all 4 digits');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
