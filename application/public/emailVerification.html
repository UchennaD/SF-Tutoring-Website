<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Email Verification</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="search.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="login.html" id="loginLink">Login</a>
            <a href="search.html" id="homeLink">Home</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="content">
        <h1>Verify Your Email</h1>

        <div class="verification-container">
            <p>Enter the 4-digit code sent to your email</p>
            
            <div class="digit-inputs">
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
                <input type="text" class="digit-box" maxlength="1" inputmode="numeric" placeholder="0" />
            </div>
            <a href="login.html" id="enterButton">Enter</a>
        </div>
    </div>

    <script>
        const digitBoxes = document.querySelectorAll('.digit-box');

        digitBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const value = e.target.value;

                if (!/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                if (value && index < digitBoxes.length - 1) {
                    digitBoxes[index + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    digitBoxes[index - 1].focus();
                }
            });
        });

        document.getElementById('enterButton').addEventListener('click', async (e) => {
            e.preventDefault();

            // create one value from 4 discrete digits
            const code = Array.from(digitBoxes).map(box => box.value).join('');
            if (code.length !== 4) {
                alert('Please enter all 4 digits');
                return;
            }

            // retrieve the User Info from sessionStorage 
            // (we haven't verified them yet, but we need their email to check for match in DB)
            const stored = sessionStorage.getItem("pendingUserInfo");

            // Handle lost sessionStorage due to idle or browser refresh
            if (!stored) {
                alert("Signup session expired. Please restart the signup process.");
                return;
            }

            // convert string to original JSON format, as seen in search.html -> results.js
            const pending = JSON.parse(stored);
            const email = pending.email;

            try {
                // Step 1: Verify OTP via authRouter -> authController.verifyOTP(email, code) 
                const verifyRes = await fetch("/api/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, otp: code })
                });

                // Parse HTTP Request response status into useful JSON format
                const verifyData = await verifyRes.json();
                if (!verifyData.success) {
                    alert("Invalid or expired code.");
                    return;
                }

                // Step 2: Create User
                const createRes = await fetch("/api/auth/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(pending)
                });

                // same process as before, convert response into useful message
                const createData = await createRes.json();
                if (!createData.success) {
                    alert("Failed to create account: " + createData.error);
                    return;
                }

                // Step 3: Clear this code from sessionStorage for security 
                sessionStorage.removeItem("pendingUserInfo");
                // Non-lazy signup: send student to their dashboard (maybe send to search in the future?)
                // 11-28-25 Revision: Make student login  *** FOR NOW *** so they can get session handling
                window.location.href = "login.html";

            } catch (err) {
                console.error("OTP verification error:", err);
                alert("Server error verifying code.");
            }
        });
    </script>
</body>
</html>
