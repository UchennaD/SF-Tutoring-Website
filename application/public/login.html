<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>GatorTutor™ - Login</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
       <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="index.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="search.html" id="homeLink">Find Tutors</a>
            <a href="studentSignUp.html" id="signupLink">Sign Up</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <form action="dashboard.html" method="GET">

                <div class="form-group">
                    <label for="emailAddress">EMAIL</label>
                    <input type="text" id="emailAddress" name="email" placeholder="jsmith@sfsu.edu" required>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" placeholder="●●●●●●●●●" required>
                </div>

                <button type="button" class="login-button" id="login-button">
                    LOGIN
                </button>

            </form>

            <div class="signup-link">
                <a href="studentSignUp.html">SIGNUP</a>
            </div>
        </div>
    </div>
    <script>
        // attach click handler to 
        document.getElementById('login-button').addEventListener('click', async (e) => {
            e.preventDefault();

            // convert string to original JSON format, as seen in search.html -> results.js
            const emailAddress = document.getElementById('emailAddress').value;
            const passwordValue = document.getElementById('password').value;

            try {
                // -------------------------------| API FLOW |-------------------------------
                // fetch -> authRouter.js -> authController.js -> login(email, password) -> |
                // verify -> store session -> res.SUCCESS/FAILURE                           |
                // -------------------------------|----------|-------------------------------

                // Step 1: Verify login info via fetch to server login endpoint
                const loginRes = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        email: emailAddress,
                        password: passwordValue
                    })
                });

                // Convert response into useful message
                const loginData = await loginRes.json();
                if (!loginData.success) {
                    alert("Failed to verify credentials: " + loginData.error);
                    return;
                }
                // If no failure, redirect to dashboard
                window.location.href = "dashboard.html";

            } catch (err) {
                console.error("OTP verification error:", err);
                alert("Server error verifying code.");
            }
        });
    </script>
</body>
</html>
