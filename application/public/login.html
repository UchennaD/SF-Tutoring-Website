<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>GatorTutor™ - Login</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
       <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="search.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="search.html" id="homeLink">Home</a>
            <a href="studentSignUp.html" id="signupLink">Sign Up</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" name="username" placeholder="" required>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" placeholder="" required>
                </div>

                <button type="button" class="login-btn"
                    onclick="window.location.href='dashboard.html'">
                    LOGIN
                </button>

            </form>

            <div class="signup-link">
                <a href="signup.html">SIGNUP</a>
            </div>
        </div>
    </div>
</body>
</html>
