<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>GatorTutor™ - Dashboard</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
       <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="studentDashboard.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="search.html" id="homeLink">Find a Tutor</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
     <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="messaging.html">Messages</a>
        <a href="tutorSignUp.html">Become a Tutor</a>
    </div>
    <div class="main">
        <h1>Welcome Back!</h1>

        <div class="cards">
            <div class="card">
                <h3>Upcoming Sessions</h3>
                <div class="scroll" id="upcoming-sessions">
                    <!-- Dynamic content -->
                </div>
            </div>
                    
            <div class="card">
                <h3>Inbox</h3>
                <p>No new messages</p>
            </div>

            <div class="card">
                <h3>Profile</h3>
                <h4 id="student-name"></h4>
                <p id="student-details"></p>
                <p class="tutor-bio" id="student-bio"></p>
            </div>
        </div>
    </div>

    <script>
        async function loadUpcomingSessions() {
            try {
                // Get user id from req.session.user.id internally
                const res = await fetch(`/api/upcoming-sessions`);
                const data = await res.json();

                const container = document.getElementById('upcoming-sessions');
                container.innerHTML = '';

                if (data.success && data.upcoming.length > 0) {
                    data.upcoming.forEach(session => {
                        const div = document.createElement('div');
                        div.classList.add('appt');
                        
                        const dateStr = new Date(session.session_date).toLocaleDateString('en-US', {
                                weekday: 'long',
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });

                            div.innerHTML = `
                                <h4>${dateStr}</h4>
                                <p><strong>${session.subjects} tutor session</strong></p>
                                <p>${session.tutor_name}</p>
                                <button class="msg-btn">Message ${session.tutor_name.split(' ')[0]}</button>
                                <button class="cancel-btn">Cancel Appointment</button>
                            `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = '<p>No upcoming sessions</p>';
                }
            } catch (err) {
                console.error('Error loading sessions:', err);
            }
        }

        async function loadStudentProfile() {
            try {
                // get current user's id from req.session internally
                const res = await fetch(`/api/profile`); 
                const data = await res.json();

                if (data.success) {
                    const profile = data.profile;

                    //Populate profile card
                    document.getElementById('student-name').textContent = profile.full_name;
                    document.getElementById('student-details').textContent =
                        `${profile.major || 'Undeclared'} • ${profile.grade_level || 'N/A'} • GPA: ${profile.gpa || 'N/A'}`;
                    document.getElementById('student-bio').textContent =
                        profile.learning_goals || 'No learning goals set yet.';
                } else {
                    console.error('Error loading profile:', data.error);
                }
            } catch (err) {
                console.error('Error fetching student profile:', err);
            }
        }

        loadUpcomingSessions();
        loadStudentProfile();
    </script>
</body>
</html>
