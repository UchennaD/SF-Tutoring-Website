<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>GatorTutor™ Student Sign Up</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
     <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="index.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="login.html" id="loginLink">Login</a>
            <a href="search.html" id="homeLink">Find Tutors</a>
        </div>
    </header>

    

    <!-- MAIN CONTENT -->
    <div class="content">
        <h1 id="pageTitle">Sign Up</h1>
        
        <div class="signup-container">
            <!-- Left side: signup form -->
            <div class="signup-form">
                <form>
                    <div class="form-group">
                        <label for="full-name">Name</label>
                        <input type="text" id="full-name" placeholder="John Smith" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Student Email</label>
                        <input type="email" id="email" placeholder="e.g. jimthefou@sfsu.edu" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm password" required>
                    </div>
                    
                    <!-- --------------------------- NOTE ---------------------------------------
                    If you use <button type="submit"> inside a <form>, you get unwanted page reload
                    on form submission!!! type="button" better for JS processing -->

                    <button type="button" class="signup-button" id="signup-button">Sign Up</button>
                    <!-- <a href="emailVerification.html" class="signup-button" id="signup-button">Sign Up</a> -->
 
                </form>

                <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

<!-- Script for passing user info to email auth page, only storing in DB once OTP is received  -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const signup = document.getElementById('signup-button');
            // create account logic: save all input to sessionStorage and redirect 
            signup.addEventListener('click', async () => {

                // get fullname
                const name = document.getElementById('full-name').value.trim();
                // NOTE: DB currently stores one full name – uncomment this to track First + Last separately
                // const [first, ...rest] = name.split(" ");
                // const last = rest.join(" ");

                // get remaining info
                const emailAddress =       document.getElementById("email").value;
                const password1 =   document.getElementById("password").value;
                const password2 =   document.getElementById("confirm-password").value;

                // first, check if passwords match
                if (password1 !== password2){
                alert("Passwords do not match, please re-enter.");
                return;
                }

                // if passwords match continue
                const pendingInfo = {
                    fullName: name,
                    email: emailAddress,
                    password: password1,
                    // role: "student" (NOT needed - base user IS NOW STUDENT by default, not 'user')
                }

                // --------------------------  TO-DO  --------------------------
                // save info in DB even before verifying (in case of crash mid-signup) as per Souza's advice

                // save this info so we can pass to backend if OTP successful
                sessionStorage.setItem("pendingUserInfo", JSON.stringify(pendingInfo));

                // 3. HTTP request to trigger backend OTP email  
                try {
                    const res = await fetch(`/api/auth/email?email=${encodeURIComponent(emailAddress)}`);
                    const data = await res.json();

                    if (!data.success) {
                        alert("Failed to send verification email. Please try again.");
                        return;
                    } else {
                        console.log("OTP email triggered. " + 
                        "OTP + Email combo added to database for later confirmation");
                    }
                } catch (err) {
                    console.error("OTP send error:", err);
                    alert("Server error sending verification code.");
                    return;
                }
                // Redirect to OTP passcode entry page upon auth API success
                window.location.href = "emailVerification.html";
            });
        });
    </script>
</body>
</html>
