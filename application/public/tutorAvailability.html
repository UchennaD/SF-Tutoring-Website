<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>GatorTutor™ - Manage Availability</title>
    <link rel="stylesheet" href="main.css" />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
</head>
<body class="tutor-theme">
    <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="tutorDashboard.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="tutorDashboard.html">Dashboard</a>
            <!-- TO-DO: Fix LOGOUT - Jamie -->
            <a href="login.html">Logout</a> 
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="sidebar">
        <h2>Tutor Menu</h2>
        <a href="tutorDashboard.html">Dashboard</a>
        <a href="tutorAvailability.html" style="background: #cb7be3de; font-weight: 600;">Set Availability</a>
        <a href="#">Messages</a>
        <a href="tutorNotes.html">Student Notes</a>
        <a href="#">Profile Settings</a>
    </div>
    
    <div class="main">
        <h1>Manage Your Availability</h1>
        
        <div class="cards">
            <div class="card">
                <h3>Add Availability</h3>
                <form id="availabilityForm">
                    <div class="form-group">
                        <label for="availabilityType">Availability Type:</label>
                        <select id="availabilityType" onchange="toggleDateInput()">
                            <option value="recurring">Recurring Weekly</option>
                            <option value="specific">Specific Date</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mode">Session Mode:</label>
                        <select id="mode">
                            <option value="Online">Online</option>
                            <option value="In-Person">In Person</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="dayOfWeekGroup">
                        <label for="dayOfWeek" style="margin-bottom: 20px;">Day of the Week:</label>
                        <select id="dayOfWeek">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                        <label for="include-today">Today included?</label>
                        <select id="include-today">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="specificDateGroup" style="display: none;">
                        <label for="specificDate">Specific Date:</label>
                        <input type="date" id="specificDate" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                    
                    <div class="form-group">
                        <label for="startTime">Start Time:</label>
                        <input type="time" id="startTime" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                    
                    <div class="form-group">
                        <label for="endTime">End Time:</label>
                        <input type="time" id="endTime" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                    
                    <button type="submit" class="filterBtn" style="width: 100%;">Add Availability</button>
                </form>
            </div>

            <div class="card">
                <h3>Current Availability</h3>
                <div class="scroll" id="currentAvailability">
                    <!-- Availability will be loaded here -->
                </div>
            </div>

            <div class="card" style="grid-column: span 2;">
                <h3>Calendar View</h3>
                <div style="margin-bottom: 10px; color: #666;">
                    (Green blocks indicate your available times)
                </div>
                <div id="availabilityCalendar" style="height: 500px;"></div>
            </div>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {            
            initializeCalendar();
            loadAvailability(); 
            document.getElementById('availabilityForm').addEventListener('submit', handleSubmit);
        });

        async function loadAvailability() {
            try {
                // No ID needed - server knows from session
                const response = await fetch('/api/tutor/availability', { credentials: 'include' });
                
                if (response.status === 401) {
                    alert('Please log in as a tutor');
                    window.location.href = 'login.html';
                    return;
                }
                
                const data = await response.json();
                if (data.success) {
                    displayAvailability(data.availability);
                    updateCalendarEvents(data.availability);
                }
            } catch (error) {
                console.error('Error loading availability:', error);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            const type = document.getElementById('availabilityType').value;
            const mode = document.getElementById('mode').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (!startTime || !endTime) {
                alert('Please select a start and end time.');
                return;
            }
            if (startTime >= endTime) {
                alert('End time must be after start time.');
                return;
            }
            
            const data = {
                time_slot: `${startTime}:00`,       // TIME column expects HH:MM:SS
                is_recurring: type === 'recurring',
                mode: mode,                         // DB requires mode NOT NULL
            };
            
            if (type === 'recurring') {
                // Day of weekly session
                data.day_of_week = document.getElementById('dayOfWeek').value;
                // Whether to include current day or start next week
                data.include_today = (document.getElementById('include-today').value.trim() === "true") ? true : false;
            } else {
                // Only offers one session on exact date
                data.specific_date = document.getElementById('specificDate').value;
            }
            
            try {
                // POST /tutor/availability -> populate tutoring_sessions table
                const response = await fetch('/api/tutor/availability', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                // turn into something useful
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    document.getElementById('availabilityForm').reset();
                    loadAvailability();
                } else {
                    alert(result.error || 'Failed to add availability');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteAvailability(sessionId) {
            try {
                const response = await fetch(`/api/tutor/availability/${sessionId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                const result = await response.json();
                if (result.success) {
                    loadAvailability();
                } else {
                    alert(result.error || 'Failed to remove');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function initializeCalendar() {
            const calendarElement = document.getElementById('availabilityCalendar');
            calendar = new FullCalendar.Calendar(calendarElement, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                slotMinTime: '07:00:00',
                slotMaxTime: '21:00:00',
                height: 500,
                events: []
            });
            calendar.render();
        }       

        function toggleDateInput() {
            const type = document.getElementById('availabilityType').value;
            const dayGroup = document.getElementById('dayOfWeekGroup');
            const dateGroup = document.getElementById('specificDateGroup');
            
            if (type === 'recurring') {
                dayGroup.style.display = 'block';
                dateGroup.style.display = 'none';
            } else {
                dayGroup.style.display = 'none';
                dateGroup.style.display = 'block';
            }
        }

        function displayAvailability(availability) {
            const container = document.getElementById('currentAvailability');

            if (!availability || availability.length === 0) {
                container.innerHTML = '<p style="color: #666;">No availability set</p>';
                return;
            }

            container.innerHTML = availability.map(slot => {
                const dayText = new Date(slot.session_date).toLocaleDateString();
                const timeText = formatTime(slot.time_slot);

                return `
                    <div class="availability-slot" style="margin-bottom: 10px;">
                        <strong>${dayText}</strong><br>
                        ${timeText} (${slot.mode})
                        <button class="cancel-btn" style="float: right; padding: 5px 10px;" onclick="deleteAvailability(${slot.id})">
                            Remove
                        </button>
                    </div>
                `;
            }).join('');
        }

        function updateCalendarEvents(availability) {
            calendar.getEvents().forEach(event => event.remove());

            if (!availability) return;

            availability.forEach(slot => {
                const start = `${slot.session_date}T${slot.time_slot}`;
                const end = addOneHourISO(start);

                calendar.addEvent({
                    id: String(slot.id),
                    title: 'Available',
                    start,
                    end,
                    backgroundColor: '#4CAF50'
                });
            });
        }

        function addOneHourISO(isoStart) {
            const d = new Date(isoStart);
            d.setHours(d.getHours() + 1);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}T${hh}:${min}:${ss}`;
        }

        function formatTime(timeString) {
            const parts = String(timeString).split(':');
            const hours = parts[0];
            const minutes = parts[1] || '00';

            const hour = parseInt(hours, 10);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;

            return `${displayHour}:${minutes} ${ampm}`;
        }
    </script>
</body>
</html>
