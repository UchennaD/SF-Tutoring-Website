<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up landing page</title>
    <!-- Reuse the same stylesheet so header + background match -->
    <link rel="stylesheet" href="main.css">

</head>
<body class = "tutor-theme">
    <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="index.html">Gator Tutor</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="login.html" id="loginLink">Login</a>
            <a href="studentSignUp.html" id="signupLink">Sign Up</a>
        </div>
    </header>

    <div id="notesLayout">

        <!-- STUDENTS -->
        <div class="column" id="colStudents">
            <h3>Student Notes</h3>
    
            <!-- Placeholder student buttons -->
            <button class="studentBtn" data-student="bryce">Bryce</button>
            <button class="studentBtn" data-student="allison">Allison</button>
            <button class="studentBtn" data-student="max">Max</button>
            <button class="studentBtn" data-student="tori">Tori</button>
            
            <hr style="margin: 20px 0;">
            <button id="addStudentBtn" class="studentBtn" style="background-color: #2196F3; color: white;">+ Add Student</button>
            <button id="newNoteBtn" class="studentBtn" style="background-color: #4CAF50; color: white;">+ New Note</button>
        </div>
    
        <!-- NOTES LIST -->
        <div class="column" id="colNotes">
            <h3>Sessions</h3>

            <select id="subjectFilter" class="filterBtn" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <option value="all">All Subjects</option>
                <option value="math">Math</option>
                <option value="science">Science</option>
                <option value="csc">Computer Science</option>
                <option value="english">English</option>
            </select>
        
            <div id="notesList">
                <!-- Filled when a student is clicked -->
            </div>
        </div>
    
        <!-- NOTE DISPLAY -->
        <div class="column" id="colDisplay">
            <div id="noteContent">
                <!-- Filled when a note is clicked -->
            </div>
        </div>
    
    </div>
</body>

<!--Script to handle loading notes for each student-->

<script>
    const tutorData = { 
        bryce: [
            { id: 1, session: "Session 1 - Calculus", subject: "math", content: "resources/notes/SampleNotes1.jpg", isImage: true },
            { id: 2, session: "Session 2 - Python", subject: "csc", content: "resources/notes/SampleNotes2.jpg", isImage: true },
            { id: 3, session: "Session 3 - Algebra", subject: "math", content: "resources/notes/SampleNotes3.jpg", isImage: true }
        ],
        allison: [
            { id: 4, session: "Session 1 - Essay Writing", subject: "english", content: "resources/notes/SampleNotes3.jpg", isImage: true },
            { id: 5, session: "Session 2 - Chemistry", subject: "science", content: "resources/notes/SampleNotes1.jpg", isImage: true }
        ],
        max: [
            { id: 6, session: "Session 1 - Physics", subject: "science", content: "resources/notes/SampleNotes4.jpg", isImage: true },
            { id: 7, session: "Session 2 - Data Structures", subject: "csc", content: "resources/notes/SampleNotes1.jpg", isImage: true },
            { id: 8, session: "Session 3 - Biology", subject: "science", content: "resources/notes/SampleNotes2.jpg", isImage: true }
        ],
        tori: [
            { id: 9, session: "Session 1 - Literature", subject: "english", content: "resources/notes/SampleNotes2.jpg", isImage: true },
            { id: 10, session: "Session 2 - Web Dev", subject: "csc", content: "resources/notes/SampleNotes4.jpg", isImage: true }
        ]
    };

    // Load manual notes from localStorage
    function loadManualNotes() {
        const saved = localStorage.getItem('manualNotes');
        if (saved) {
            const manualNotes = JSON.parse(saved);
            Object.keys(manualNotes).forEach(student => {
                if (tutorData[student]) {
                    tutorData[student] = [...tutorData[student], ...manualNotes[student]];
                }
            });
        }
    }

    // Load students from localStorage
    function loadStudentsFromStorage() {
        const saved = localStorage.getItem('students');
        if (saved) {
            const savedStudents = JSON.parse(saved);
            savedStudents.forEach(studentName => {
                if (!tutorData[studentName]) {
                    tutorData[studentName] = [];
                }
            });
        }
    }

    loadManualNotes();
    loadStudentsFromStorage();

    let currentStudent = null;
    let currentFilter = 'all';
    let currentEditingNote = null;

    // Render student buttons dynamically
    function renderStudentButtons() {
        const container = document.getElementById('colStudents');
        const newNoteBtn = document.getElementById('newNoteBtn');
        const addStudentBtn = document.getElementById('addStudentBtn');
        
        // Remove all old student buttons
        document.querySelectorAll('.studentBtn[data-student]').forEach(btn => btn.remove());
        
        // Add student buttons back in order
        const students = Object.keys(tutorData);
        students.forEach(student => {
            const btn = document.createElement('button');
            btn.className = 'studentBtn';
            btn.dataset.student = student;
            btn.textContent = student.charAt(0).toUpperCase() + student.slice(1);
            btn.addEventListener('click', () => {
                document.querySelectorAll(".studentBtn[data-student]").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                loadStudentNotes(student);
            });
            container.insertBefore(btn, addStudentBtn);
        });
    }

    // Handle adding new student
    document.getElementById('addStudentBtn').addEventListener('click', () => {
        const studentName = prompt('Enter student name:');
        if (studentName && studentName.trim()) {
            const normalizedName = studentName.trim().toLowerCase();
            if (tutorData[normalizedName]) {
                alert('Student already exists!');
                return;
            }
            tutorData[normalizedName] = [];
            saveStudentsToStorage();
            renderStudentButtons();
        }
    });

    // Function to load student notes with filter
    function loadStudentNotes(studentKey) {
        currentStudent = studentKey;
        const sessions = tutorData[studentKey];
        const list = document.getElementById('notesList');
        list.innerHTML = ''; // Clear previous notes

        // Filter sessions based on selected subject
        const filteredSessions = currentFilter === 'all' 
            ? sessions 
            : sessions.filter(session => session.subject === currentFilter);

        if (filteredSessions.length === 0) {
            list.innerHTML = '<p style="color: #666; padding: 10px;">No sessions found for selected subject</p>';
            document.getElementById("noteContent").innerHTML = '';
            return;
        }

        filteredSessions.forEach(session => {
            const noteBtn = document.createElement('button');
            noteBtn.className = 'noteBtn';
            noteBtn.textContent = session.session;
            noteBtn.addEventListener('click', () => {
                document.querySelectorAll(".noteBtn")
                    .forEach(btn => btn.classList.remove("selected"));

                noteBtn.classList.add("selected");

                if (session.isImage) {
                    document.getElementById('noteContent').innerHTML = `
                        <img src="${session.content}" style="width:100%; max-width:700px;">
                    `;
                } else {
                    displayNote(session);
                }
            });

            list.appendChild(noteBtn);
        });

        document.getElementById("noteContent").innerHTML = '<p style="color: #999; text-align: center; margin-top: 50px;">Select a session to view notes.</p>';
    }

    // Display a text note with edit option
    function displayNote(note) {
        currentEditingNote = note;
        const content = document.getElementById('noteContent');
        content.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0;">${note.session}</h3>
                <div>
                    <button id="editBtn" class="noteBtn" style="background-color: #2196F3; color: white; margin-right: 5px;">Edit</button>
                    <button id="deleteBtn" class="noteBtn" style="background-color: #f44336; color: white;">Delete</button>
                </div>
            </div>
            <div id="noteText" style="padding: 15px; background: #f9f9f9; border-radius: 5px; min-height: 300px; font-family: 'Segoe UI', sans-serif; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;">
                ${note.content}
            </div>
        `;
        
        document.getElementById('editBtn').addEventListener('click', () => {
            showNoteEditor(note);
        });

        document.getElementById('deleteBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to delete this note?')) {
                deleteNote(note);
            }
        });
    }

    // Show note editor (create or edit)
    function showNoteEditor(note) {
        const content = document.getElementById('noteContent');
        const isEditing = note !== null;
        const sessionName = note ? note.session : 'New Note';
        const noteText = note ? note.content : '';

        content.innerHTML = `
            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
                <input type="text" id="sessionTitle" placeholder="Session Name" value="${isEditing ? sessionName : ''}" 
                    style="font-size: 16px; padding: 10px; flex: 1; min-width: 150px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                <select id="sessionSubject" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                    <option value="math" ${note && note.subject === 'math' ? 'selected' : ''}>Math</option>
                    <option value="science" ${note && note.subject === 'science' ? 'selected' : ''}>Science</option>
                    <option value="csc" ${note && note.subject === 'csc' ? 'selected' : ''}>Computer Science</option>
                    <option value="english" ${note && note.subject === 'english' ? 'selected' : ''}>English</option>
                </select>
            </div>
            <div style="display: flex; gap: 5px; margin-bottom: 15px;">
                <button id="boldBtn" style="padding: 8px 12px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-weight: bold;"><strong>B</strong></button>
                <button id="italicBtn" style="padding: 8px 12px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;"><i>I</i></button>
                <button id="underlineBtn" style="padding: 8px 12px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;"><u>U</u></button>
            </div>
            <textarea id="noteEditor" placeholder="Start typing your notes..." 
                style="flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Segoe UI', sans-serif; font-size: 14px; resize: vertical; box-sizing: border-box; min-height: 400px;">${noteText}</textarea>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="saveBtn" style="padding: 12px 25px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; flex: 0 0 auto;">Save</button>
                <button id="cancelBtn" style="padding: 12px 25px; background-color: #999; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; flex: 0 0 auto;">Cancel</button>
            </div>
        `;

        const editor = document.getElementById('noteEditor');

        // Text formatting buttons
        document.getElementById('boldBtn').addEventListener('click', () => {
            wrapText(editor, '**', '**');
        });
        document.getElementById('italicBtn').addEventListener('click', () => {
            wrapText(editor, '*', '*');
        });
        document.getElementById('underlineBtn').addEventListener('click', () => {
            wrapText(editor, '__', '__');
        });

        // Save button
        document.getElementById('saveBtn').addEventListener('click', () => {
            const title = document.getElementById('sessionTitle').value.trim();
            const subject = document.getElementById('sessionSubject').value;
            const text = editor.value.trim();

            if (!title || !text) {
                alert('Please enter a session name and notes');
                return;
            }

            if (isEditing && note) {
                // Update existing note
                note.session = title;
                note.subject = subject;
                note.content = text;
            } else {
                // Create new note
                const newNote = {
                    id: Date.now(),
                    session: title,
                    subject: subject,
                    content: text,
                    isImage: false
                };
                tutorData[currentStudent].push(newNote);
            }

            saveNotesToStorage();
            loadStudentNotes(currentStudent);
        });

        // Cancel button
        document.getElementById('cancelBtn').addEventListener('click', () => {
            loadStudentNotes(currentStudent);
        });

        editor.focus();
    }

    // Helper function to wrap selected text
    function wrapText(textarea, before, after) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selectedText = textarea.value.substring(start, end);
        const newText = textarea.value.substring(0, start) + before + selectedText + after + textarea.value.substring(end);
        textarea.value = newText;
        textarea.focus();
    }

    // Delete a note
    function deleteNote(note) {
        if (currentStudent && tutorData[currentStudent]) {
            const index = tutorData[currentStudent].findIndex(n => n.id === note.id);
            if (index > -1) {
                tutorData[currentStudent].splice(index, 1);
                saveNotesToStorage();
                loadStudentNotes(currentStudent);
            }
        }
    }

    // Save students to localStorage
    function saveStudentsToStorage() {
        const students = Object.keys(tutorData);
        localStorage.setItem('students', JSON.stringify(students));
    }

    // Save notes to localStorage
    function saveNotesToStorage() {
        const manualNotes = {};
        Object.keys(tutorData).forEach(student => {
            manualNotes[student] = tutorData[student].filter(note => !note.isImage);
        });
        localStorage.setItem('manualNotes', JSON.stringify(manualNotes));
    }

    // Handle subject filter changes
    document.getElementById('subjectFilter').addEventListener('change', (e) => {
        currentFilter = e.target.value;
        if (currentStudent) {
            loadStudentNotes(currentStudent);
        }
    });

    // Handle new note button
    document.getElementById('newNoteBtn').addEventListener('click', () => {
        showNoteEditor(null);
    });

    // Render initial student buttons
    renderStudentButtons();
</script>
