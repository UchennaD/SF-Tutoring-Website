<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Sign Up</title>
    <link rel="stylesheet" href="tutorsignup.css">
</head>
<body>
    <!-- Header -->
    <div id="mainHeader">
        <div id="header-left">
            <img id="SFSUSeal" src="resources/images/SFSU_seal.png" alt="SFSU Seal">
            <h1 id="siteTitle">GatorTutor</h1>
        </div>
        <div id="header-right">
            <a href="login.html">Login</a>
            <a href="studentSignUp.html">Student Sign Up</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <a href="#personal" class="tab-link active" onclick="switchTab('personal')">Personal</a>
            <a href="#experience" class="tab-link" onclick="switchTab('experience')">Experience</a>
            <a href="#about" class="tab-link" onclick="switchTab('about')">About</a>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <!-- Personal Tab -->
            <div id="personal" class="tab-content active">
                <h2>Sign Up</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Smith">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="e.g., jsmith@sfsu.edu">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••">
                    </div>
                    <button type="button" class="next-button" onclick="switchTab('experience')">Next</button>
                </form>
            </div>

            <!-- Experience Tab -->
            <div id="experience" class="tab-content">
                <h2>Experience</h2>
                <form>
                    <div class="form-group">
                        <label for="education">Highest Education</label>
                        <select id="education" name="education">
                            <option value="">Select One</option>
                            <option value="some-college">Some College</option>
                            <option value="bachelors">Bachelors</option>
                            <option value="masters">Masters</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="specialty">Degree Of Specialty</label>
                        <input type="text" id="specialty" name="specialty" placeholder="e.g., Computer Science">
                    </div>
                    <div class="form-group">
                        <label for="school">School</label>
                        <input type="text" id="school" name="school" placeholder="">
                    </div>
                    <div class="button-group">
                        <button type="button" class="prev-button" onclick="switchTab('personal')">Back</button>
                        <button type="button" class="next-button" onclick="switchTab('about')">Next</button>
                    </div>
                </form>
            </div>

            <!-- About Tab -->
            <div id="about" class="tab-content">
                <h2>About</h2>
                <form>
                    <div class="form-group">
                        <label for="bio">Bio</label>
                        <textarea id="bio" name="bio" placeholder="Tell us about yourself..." maxlength="500"></textarea>
                        <div class="char-count"><span id="charCount">0</span>/500</div>
                    </div>
                    <div class="button-group">
                        <button type="button" class="prev-button" onclick="switchTab('experience')">Back</button>
                        <button type="submit" class="submit-button">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all tabs
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Remove active class from all links
            const links = document.querySelectorAll('.tab-link');
            links.forEach(link => link.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to clicked link
            event.target.classList.add('active');
        }

        // Character counter for textarea
        document.getElementById('bio').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });
    </script>
</body>
</html>
