<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Tutor - Gator Tutors</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- HEADER -->
    <header id="mainHeader">
        <div id="header-left">
            <img src="resources/SFSUSeal.png" id="SFSUSeal" alt="SFSU Seal">
            <h2 id="siteTitle">
                <a id="homeLink" href="dashboard.html">Gator Tutors</a>
            </h2>
        </div>
        <div id="header-right">
            <a href="search.html" id="homeLink">Find a Tutor</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="tutor-signup-container">
        <div class="tutor-signup-box">
            <h1>Become a Gator Tutor</h1>
            <p class="tutor-signup-subtitle">Share your expertise and help students succeed</p>

            <form id="tutorSignUpForm" class="tutor-form">
                <!-- Experience Field -->
                <div class="form-group">
                    <label for="experience">Years of Experience</label>
                    <input 
                        type="number" 
                        id="experience" 
                        name="experience" 
                        placeholder="e.g., 3"
                        min="0"
                        max="60"
                        required
                    >
                    <small>How many years of tutoring experience do you have?</small>
                </div>

                <!-- Subject Specialty Field -->
                <div class="form-group">
                    <label for="subject">Subject Specialty</label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        placeholder="e.g., Mathematics, Chemistry, Computer Science"
                        required
                    >
                    <small>What subject(s) do you specialize in?</small>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="tutor-submit-btn">Submit Application</button>
            </form>

            <p class="tutor-login-link">
                Already have a tutor account? <a href="dashboard.html">Back to Dashboard</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('tutorSignUpForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const experience = document.getElementById('experience').value;
            const subject = document.getElementById('subject').value;

            // Validate inputs
            if (!experience || !subject) {
                alert('Please fill in all fields.');
                return;
            }

            // Simulate form submission
            alert(`Application submitted successfully!\n\nExperience: ${experience} years\nSubject: ${subject}\n\nWe'll review your application and get back to you soon!`);

            // Reset form
            form.reset();

            // Redirect to dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        });
    </script>
</body>
</html>
